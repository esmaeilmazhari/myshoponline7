<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <title>پرداخت موفق</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; padding: 50px; background: #f4f4f9; }
        .card { background: white; max-width: 400px; margin: auto; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        a { background: #333; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; display: inline-block; margin-top: 20px; }

</head>
<body>
<div class="card">
    <h2 style="color: green;">پرداخت آزمایشی با موفقیت انجام شد!</h2>
    <p>سفارش شما با شماره پیگیری <strong>{{ order.id }}</strong> ثبت گردید.</p>
    <a href="{% url 'product_list' %}">بازگشت به فروشگاه</a>
</div>
</body>
</html>
